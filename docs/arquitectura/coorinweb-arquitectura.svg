ll="#38475b" >Stores de selección y producto</text><text x="58" y="694.4" font-family="Arial, sans-serif" font-size="18" fill="#38475b" >sessionStorage + localStorage</text><text x="458" y="550" font-family="Arial, sans-serif" font-size="24" fill="#7353ad" font-weight="600">Formularios y contratos</text><text x="458" y="590" font-family="Arial, sans-serif" font-size="18" fill="#38475b" >schemas/formSchemas.js · Zod</text><text x="458" y="616.1" font-family="Arial, sans-serif" font-size="18" fill="#38475b" >hooks/useZodValidation.js</text><text x="458" y="642.2" font-family="Arial, sans-serif" font-size="18" fill="#38475b" >forms/queryAdapters.js → DTO</text><text x="458" y="668.3" font-family="Arial, sans-serif" font-size="18" fill="#38475b" >forms/formContracts.js</text><text x="458" y="694.4" font-family="Arial, sans-serif" font-size="18" fill="#38475b" >verified / partial / pending-audit</text><text x="898" y="550" font-family="Arial, sans-serif" font-size="24" fill="#3368ac" font-weight="600">UI compartida</text><text x="898" y="590" font-family="Arial, sans-serif" font-size="18" fill="#38475b" >components/Modal · GlobalModal</text><text x="898" y="616.1" font-family="Arial, sans-serif" font-size="18" fill="#38475b" >Select, CatalogSelect y campos</text><text x="898" y="642.2" font-family="Arial, sans-serif" font-size="18" fill="#38475b" >Tablas, filtros y notificaciones</text><text x="898" y="668.3" font-family="Arial, sans-serif" font-size="18" fill="#38475b" >Tailwind 4 + Preline + Sonner</text><text x="898" y="694.4" font-family="Arial, sans-serif" font-size="18" fill="#38475b" >utils/ExcelExporter.js · XLSX</text><text x="40" y="864" font-family="Arial, sans-serif" font-size="24" fill="#28724e" font-weight="600">02 / SERVICIOS Y COMUNICACIÓN</text><text x="58" y="950" font-family="Arial, sans-serif" font-size="24" fill="#28724e" font-weight="600">Servicios por dominio</text><text x="58" y="990" font-family="Arial, sans-serif" font-size="18" fill="#38475b" >CatalogService → normaliza y valida respuestas</text><text x="58" y="1016.1" font-family="Arial, sans-serif" font-size="18" fill="#38475b" >ConsultationService → fachada de consultas Loki</text><text x="58" y="1042.2" font-family="Arial, sans-serif" font-size="18" fill="#38475b" >VisitService → CRUD / cargas FormData</text><text x="58" y="1068.3" font-family="Arial, sans-serif" font-size="18" fill="#38475b" >dayExecutiveService → reporte validado con Zod</text><text x="58" y="1094.4" font-family="Arial, sans-serif" font-size="18" fill="#38475b" >AuthServices → login con servidor Albaz</text><text x="663" y="950" font-family="Arial, sans-serif" font-size="24" fill="#28724e" font-weight="600">Integración Loki y configuración</text><text x="663" y="990" font-family="Arial, sans-serif" font-size="18" fill="#38475b" >services/mark/orochi/LokiServices.js</text><text x="663" y="1016.1" font-family="Arial, sans-serif" font-size="18" fill="#38475b" >services/mark/albaz/LokiServices.js</text><text x="663" y="1042.2" font-family="Arial, sans-serif" font-size="18" fill="#38475b" >Módulos conservan llamadas directas a Loki</text><text x="663" y="1068.3" font-family="Arial, sans-serif" font-size="18" fill="#38475b" >config/backend.js: ACTIVE_SERVER = "albaz"</text><text x="663" y="1094.4" font-family="Arial, sans-serif" font-size="18" fill="#38475b" >Consultas y catálogos usan el servidor activo</text><text x="368" y="1270" font-family="Arial, sans-serif" font-size="24" fill="#28724e" font-weight="600">Cliente HTTP · Axios</text><text x="368" y="1310" font-family="Arial, sans-serif" font-size="18" fill="#38475b" >loki/apiConfig.js · instancia compartida</text><text x="368" y="1336.1" font-family="Arial, sans-serif" font-size="18" fill="#38475b" >baseURL: import.meta.env.VITE_API_URL</text><text x="368" y="1362.2" font-family="Arial, sans-serif" font-size="18" fill="#38475b" >Interceptor: Authorization Bearer salvo login</text><text x="368" y="1388.3" font-family="Arial, sans-seri
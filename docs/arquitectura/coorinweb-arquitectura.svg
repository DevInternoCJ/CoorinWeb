t="600">Contexto de migración</text><text x="1338" y="1040" font-family="Arial, sans-serif" font-size="18" fill="#38475b" >Formularios legacy → equivalentes React</text><text x="1338" y="1066.1" font-family="Arial, sans-serif" font-size="18" fill="#38475b" >CONTEXTO_*.md + MAPEO_ENDPOINTS_*</text><text x="1338" y="1092.2" font-family="Arial, sans-serif" font-size="18" fill="#38475b" >Grafo legacy existente como referencia</text><text x="1338" y="1118.3" font-family="Arial, sans-serif" font-size="18" fill="#38475b" >PendingAuditForm para contratos pendientes</text><text x="40" y="1528" font-family="Arial, sans-serif" font-size="18" fill="#38475b" >AZUL: presentación   ·   VIOLETA: estado y contratos   ·   VERDE: integración   ·   NARANJA: sistemas externos documentados</text><text x="40" y="1573" font-family="Arial, sans-serif" font-size="18" fill="#38475b" >Flechas: dependencias / flujo de solicitud. La respuesta regresa por las mismas capas. No se presupone que todos los módulos legacy estén migrados.</text></svg>